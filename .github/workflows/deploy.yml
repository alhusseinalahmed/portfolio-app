name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ändra till 'master' om din huvudbranch heter så

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v3

      - name: Installera Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Installera dependencies
        run: npm install

      - name: Bygg projektet
        run: npm run build

      - name: Publicera till gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build  # Viktigt: Ändra till ./dist om du skapade appen med Vite
